<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - My CSC2130 Project</title>
</head>
<body>

    <!-- Header & Nav -->
    <header>
        <h1>Project Gallery</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a> |
            <a href="data.html">Data</a> |
            <a href="gallery.html">Gallery</a>
        </nav>
    </header>

    <main>
        <!-- Section 1: Images (Requirement c) -->
        <section>
            <h2>Images</h2>
            <!-- Using your images folder, with alt text and lazy loading -->
            <img src="images/logo.png" alt="Project logo" width="300" loading="lazy">
            <img src="images/school.JPG" alt="School campus image" width="300" loading="lazy">
            <img src="images/logo.png" alt="Project logo repeated" width="300" loading="lazy">
        </section>

        <!-- Section 2: Table (Requirement d) -->
        <section>
            <h2>Summary Table</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th scope="col">Category</th>
                        <th scope="col">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Completed</td>
                        <td>10</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Article (Requirement b) -->
        <article>
            <h2>About This Gallery</h2>
            <p>This gallery showcases the visual elements and media of the project.</p>
        </article>

        <!-- Section 3: Media (Requirement e) -->
        <section>
            <h2>Media</h2>
            <!-- Video element with controls, dimensions, and a poster -->
            <video controls width="640" height="360" poster="images/logo.png">
                <source src="media/intro.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </section>

        <!-- Aside (Requirement b) -->
        <aside>
            <h3>Related Links</h3>
            <ul>
                <li><a href="index.html">Back to Home</a></li>
            </ul>
        </aside>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; All rights reserved.</p>
    </footer>

</body>
</html>
