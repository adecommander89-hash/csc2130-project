<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - St. Peter's Budokomi</title>
</head>
<body>

    <header>
        <img src="images/logo.png" alt="St. Peter's Budokomi Senior School Logo" width="80">
        <h1>St. Peter's Budokomi Senior School</h1>
        <p><em>Elimu ni Ngao</em></p>
    </header>

    <main>
        <h2>Staff & Admin Portal</h2>
        <p>Please log in to access the management system.</p>

        <!-- Week 4 Lab: Login Form -->
        <form action="#" method="post">
            <fieldset>
                <legend>Secure Login</legend>

                <label for="staff-id">Staff ID / Username:</label>
                <input type="text" id="staff-id" name="staff-id" placeholder="Enter your staff ID" required>

                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required>

                <br><br>

                <button type="submit">Log In</button>
                <button type="reset">Clear</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 St. Peter's Budokomi Senior School. All rights reserved.</p>
        <!-- A small link to get back to the public site -->
        <p><small><a href="index.html">Return to Public Website</a></small></p>
    </footer>

</body>
</html>
